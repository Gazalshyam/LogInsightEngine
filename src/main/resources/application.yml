server:
  port: 8080

management:
  endpoint:
    health:
      show-details: always
  endpoints:
    web:
      exposure:
        include: health
ocr:
  tessdata-path: /usr/share/tesseract-ocr/4.00/tessdata/
openai:
  api-key: ${OPENAI_API_KEY}
  model: ${OPENAI_MODEL:gpt-5.6}
  timeout: ${OPENAI_TIMEOUT:30s}
  temperature: ${OPENAI_TEMPERATURE:0.0}
  max-output-tokens: ${OPENAI_MAX_OUTPUT_TOKENS:2000}